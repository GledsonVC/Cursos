<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Fontes Externas</title>
        <style>
            @font-face {
                font-family: "Love";
                src: url("./fonts/love larry.ttf") format("truetype");
                font-weight: normal;
                font-style: normal;
                /*
                Tipos de format()
                -opentype (otf)
                -truetype (ttf)
                -embedded-opentype
                -truetype-att (Apple Advanced Typography)
                -svg
                */
            }

            body {
                font-family: Arial, Helvetica, sans-serif;
            }

            h1 {
                font-family: "Love", Times, serif;
                font-size: 3em;
                font-weight: normal;
            }
        </style>
    </head>
    <body>
        <h1>Olá, Mundo!</h1>
        <p>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Vitae,
            voluptate placeat error nisi excepturi animi ex, facilis
            necessitatibus libero accusantium quos quaerat qui. Pariatur, id.
            Vero quod nihil porro ullam.
        </p>
    </body>
</html>
